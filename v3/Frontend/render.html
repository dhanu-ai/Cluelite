<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cluelite - AI Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: transparent;
      height: 100vh;
      overflow: hidden;
      backdrop-filter: blur(0px);
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 10px;
      gap: 12px;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 8px;
      -webkit-app-region: drag;
    }

    .app-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
      -webkit-app-region: no-drag;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .nav-btn {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 12px;
      background: rgba(30, 30, 30, 0.7);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.6);
    }

    .start-btn:hover {
      background: rgba(16, 185, 129, 0.7);
    }

    .stop-btn:hover {
      background: rgba(239, 68, 68, 0.7);
    }

    .close-btn:hover {
      background: rgba(107, 114, 128, 0.7);
    }

    .main-content {
      display: flex;
      flex: 1;
      gap: 12px;
      overflow: hidden;
    }

    .card {
      flex: 1;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-header {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-header svg {
      width: 16px;
      height: 16px;
      filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.7));
    }

    .suggestion-box {
      border-radius: 6px;
      padding: 10px;
      flex: 1;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.4;
      color: #ffffff;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
    }

    .suggestion-box p {
      margin: 8px 0;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(20, 20, 20, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 13px;
      line-height: 1.5;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .message {
      padding: 8px;
      border-radius: 6px;
      max-width: 90%;
      font-size: 12px;
      line-height: 1.3;
      background: rgba(30, 30, 30, 0.7);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.6);
    }

    .user-message {
      align-self: flex-end;
    }

    .ai-message {
      align-self: flex-start;
    }

    .input-area {
      display: flex;
      gap: 6px;
    }

    .chat-input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(30, 30, 30, 0.7);
      color: #ffffff;
      font-size: 12px;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.6);
    }

    .chat-input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .chat-input::placeholder {
      color: rgba(255, 255, 255, 0.7);
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
    }

    .upload-btn {
      padding: 8px;
      border-radius: 6px;
      background: rgba(30, 30, 30, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.6);
    }

    .upload-btn:hover {
      background: rgba(60, 60, 60, 0.7);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(30, 30, 30, 0.3);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(100, 100, 100, 0.7);
      border-radius: 3px;
    }

    @keyframes pulse {
      0% {
        opacity: 0.7;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
      }
      50% {
        opacity: 1;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
      }
      100% {
        opacity: 0.7;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
      }
    }

    .pulse {
      animation: pulse 2s infinite;
    }

    .status-message {
      font-style: italic;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <div class="app-title">CLUELITE</div>
      <div class="nav-buttons">
        <button class="nav-btn start-btn interactive" id="startBtn">START</button>
        <button class="nav-btn stop-btn interactive" id="stopBtn">STOP</button>
        <button class="nav-btn close-btn interactive" id="closeBtn">X</button>
      </div>
    </nav>

    <div class="main-content">
      <div class="card">
        <div class="card-header">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
          Live Suggestions
        </div>
        <div class="suggestion-box" id="suggestionBox">
          <p class="status-message">Waiting for conversation to begin...</p>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
          </svg>
          Cluelite Chat
        </div>
        <div class="chat-messages" id="chatMessages">
          <div class="message ai-message">
            Ready to assist with your interview. Click START to begin.
          </div>
        </div>
        <div class="input-area">
          <input type="text" class="chat-input interactive" id="chatInput" placeholder="Ask Cluelite...">
          <button class="upload-btn interactive" id="uploadBtn">+</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Handle AI suggestions from backend
    if (window.api) {
      window.api.onSuggestion((suggestion) => {
        const suggestionBox = document.getElementById('suggestionBox');

        if (suggestion.includes('No suggestions') || suggestion.includes('No content') || suggestion.trim() === '') {
          return;
        }

        if (suggestionBox.querySelector('.status-message')) {
          suggestionBox.innerHTML = '';
        }

        const newSuggestion = document.createElement('p');
        newSuggestion.textContent = suggestion;
        newSuggestion.className = 'pulse';
        suggestionBox.appendChild(newSuggestion);
        suggestionBox.scrollTop = suggestionBox.scrollHeight;

        setTimeout(() => {
          newSuggestion.classList.remove('pulse');
        }, 5000);
      });
    }

    const chatInput = document.getElementById('chatInput');
    const chatMessages = document.getElementById('chatMessages');

    chatInput.addEventListener('keypress', async (e) => {
      if (e.key === 'Enter' && chatInput.value.trim() !== '') {
        const userMessage = document.createElement('div');
        userMessage.className = 'message user-message';
        userMessage.textContent = chatInput.value;
        chatMessages.appendChild(userMessage);

        if (window.api && window.api.askCluelite) {
          try {
            const response = await window.api.askCluelite(chatInput.value);
            const aiMessage = document.createElement('div');
            aiMessage.className = 'message ai-message';
            aiMessage.textContent = response.response;
            chatMessages.appendChild(aiMessage);
          } catch (error) {
            const aiMessage = document.createElement('div');
            aiMessage.className = 'message ai-message';
            aiMessage.textContent = 'Sorry, I encountered an error. Please try again.';
            chatMessages.appendChild(aiMessage);
          }
        }

        chatInput.value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    });

    // Handle file upload
    document.getElementById('uploadBtn').addEventListener('click', async () => {
      if (window.api && window.api.pickFile) {
        try {
          const filePaths = await window.api.pickFile();
          if (filePaths && filePaths.length > 0) {
            const aiMessage = document.createElement('div');
            aiMessage.className = 'message ai-message';
            aiMessage.textContent = `File uploaded: ${filePaths[0]}`;
            chatMessages.appendChild(aiMessage);
            chatMessages.scrollTop = chatMessages.scrollHeight;
          }
        } catch (error) {
          console.error('Error uploading file:', error);
        }
      }
    });

    // Start button
    document.getElementById('startBtn').addEventListener('click', () => {
      if (window.api && window.api.startCluelite) {
        window.api.startCluelite();
        document.getElementById('suggestionBox').innerHTML = '<p class="status-message">Listening for conversation...</p>';
        chatMessages.innerHTML = '<div class="message ai-message">Monitoring started. I\'ll help with suggestions as you speak.</div>';
      }
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
    });

    // Stop button
    document.getElementById('stopBtn').addEventListener('click', () => {
      if (window.api && window.api.stopCluelite) {
        window.api.stopCluelite();
        document.getElementById('suggestionBox').innerHTML = '<p class="status-message">Monitoring stopped.</p>';
        const aiMessage = document.createElement('div');
        aiMessage.className = 'message ai-message';
        aiMessage.textContent = 'Monitoring stopped. Ready to start again.';
        chatMessages.appendChild(aiMessage);
      }
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    });

    // Close button
    document.getElementById('closeBtn').addEventListener('click', () => {
      if (window.api && window.api.close) {
        window.api.close();
      }
    });

    // Initially disable stop button
    document.getElementById('stopBtn').disabled = true;

    // Enable interaction on hover for interactive elements
    document.querySelectorAll('.interactive').forEach(el => {
      el.addEventListener('mouseenter', () => window.api.enableInteraction());
      el.addEventListener('mouseleave', () => window.api.disableInteraction());
    });
  </script>
</body>
</html>
